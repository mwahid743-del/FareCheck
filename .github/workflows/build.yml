name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: app/src/main/assets/postcodes.bin
          key: postcodes-${{ hashFiles('tools/build_postcodes.py') }}
      - run: python3 tools/build_postcodes.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: farecheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
